server.port=${SERVER_PORT:8095}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sfquiz?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sfquiz}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sfquiz}
# driver-class-name and dialect are auto-detected by Spring Boot / Hibernate from
# the JDBC URL — leaving them unset lets the same jar run on MySQL (local docker
# compose) and PostgreSQL (Heroku) without code changes.

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# When set, skips the JDBC-metadata round-trip Hibernate normally uses to
# detect the SQL dialect. On Heroku Postgres essential-0 that first connection
# can SSL-handshake-timeout, crashing the whole app context; pinning the
# dialect via env lets Hibernate boot even when the database is briefly
# unreachable. Empty default keeps local docker-compose (MySQL) auto-detect.
#   Heroku:  HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:}

# JDBC pool size — needs enough headroom for: HTTP threads + background
# extraction tasks (each chunk holds a conn briefly between Claude calls)
# + recovery sweep + bulk approve/reject loops. Pool=5 was getting drained
# under modest load (3 simultaneous timeouts seen at 20:23 from a single
# admin's bulk action overlapping with a recovery-sweep extraction). 10
# is generous for current traffic and stays well under Heroku Postgres
# essential's 20-conn cap. Idle conns are ~3-5 MB each on the dyno.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.idle-timeout=300000
# Heroku Postgres tends to drop idle TCP sockets aggressively; if Hikari
# only pings every 120 s, a stale connection can sit in the pool for up
# to 2 min before being detected — handed out to a real request that
# then stalls on socket timeout + reconnect. 30 s catches those much
# faster, and the extra "SELECT 1" pings cost effectively nothing.
spring.datasource.hikari.keepalive-time=30000
# How long Hikari waits for isValid() before declaring a connection
# dead and replacing it. Default is 5 s; trimming to 2 s means a slow
# request after long idle gets a fresh connection sooner.
spring.datasource.hikari.validation-timeout=2000
# Don't fail-fast the app context if the very first connection attempt
# times out — Hikari fills the pool lazily on first traffic instead.
# Combined with the explicit hibernate.dialect above, this means a flaky
# Heroku Postgres SSL handshake just delays the first request instead of
# crashing the dyno into a restart loop.
spring.datasource.hikari.initialization-fail-timeout=0

# Cap Tomcat's worker pool. Spring Boot's default is 200 threads, each of which
# reserves a ~512KB native stack — up to ~100MB committed for threads that will
# never see traffic on a single-dyno app. 50 keeps comfortable headroom for the
# /uploads/api/status polling clients without starving anyone, and still saves
# ~75MB resident on Heroku vs. the default.
server.tomcat.threads.max=${TOMCAT_THREADS_MAX:50}
server.tomcat.threads.min-spare=${TOMCAT_THREADS_MIN:10}
server.tomcat.accept-count=50

# Initialize Spring's DispatcherServlet at startup instead of on the
# first request. Default is lazy (-1), which adds ~100-300 ms to the
# very first hit after every restart — exactly the "first page is slow
# after deploy" symptom. Costs a small amount of startup time which we
# already absorb during the dyno boot.
spring.mvc.servlet.load-on-startup=1

# HTTP session timeout. 2h matches a realistic test-taking session
# (90-min practice exam + post-test review of answers) without making
# users re-login mid-quiz. Override via SESSION_TIMEOUT env var, e.g.
#   heroku config:set SESSION_TIMEOUT=8h
# Accepts Spring's standard duration syntax: 30s, 15m, 2h, 1d.
server.servlet.session.timeout=${SESSION_TIMEOUT:2h}

spring.sql.init.mode=never

# Thymeleaf — disable cache during dev
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

# ----------------- Mail -----------------
# Defaults work with the mailpit container in docker-compose.
# Override via env vars to use a real SMTP server (e.g. SendGrid, SES).
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ----------------- App settings -----------------
app.mail.from=${MAIL_FROM:noreply@sfquiz.local}
# Always also log generated emails to the console so you can grab the temp password
# even if SMTP isn't reachable.
app.mail.console-fallback=${MAIL_CONSOLE_FALLBACK:true}

# Default admin account — created once on startup if no admin exists.
app.admin.email=${ADMIN_EMAIL:admin@local}
app.admin.password=${ADMIN_PASSWORD:ChangeMe123!}
app.admin.full-name=${ADMIN_NAME:Default Admin}

# Used in the password-reset email link.
app.base-url=${APP_BASE_URL:http://localhost:8095}

# ----------------- Study material uploads -----------------
# Admins upload .txt / .md / .html / .pdf / images at /admin/uploads. Files are
# stored as bytea rows in the study_uploads Postgres table (NOT the dyno
# filesystem, which is ephemeral). An in-process extractor runs Claude on each
# upload and writes survivors as PENDING questions for admin approval.
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:25MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:25MB}

# ----------------- Anthropic / extraction pipeline -----------------
anthropic.api-key=${ANTHROPIC_API_KEY:}
# Models — claude-sonnet-4-6 for extraction (vision-capable), claude-haiku-4-5
# for the cheap quality gate.
anthropic.model.extract=${ANTHROPIC_MODEL_EXTRACT:claude-sonnet-4-6}
anthropic.model.classify=${ANTHROPIC_MODEL_CLASSIFY:claude-haiku-4-5}

# Daily USD budget across all Anthropic calls. Refuses new extraction work once
# the calendar-day spend (UTC) hits this number; resumes at UTC midnight.
app.extraction.daily-budget-usd=${EXTRACTION_DAILY_BUDGET_USD:2.0}

# How often the background recovery sweep runs (ms). Picks up uploads that
# crashed mid-extraction (e.g. dyno restart while processing).
app.extraction.recovery-interval-ms=${EXTRACTION_RECOVERY_INTERVAL_MS:60000}
# How long an upload can sit in PROCESSING before recovery re-claims it.
# Chunked PDF extractions for big files (5 chunks × ~2 min each) easily
# run 10+ minutes end-to-end. The recovery sweep used to fire at 5 min
# and re-queue an in-flight upload, doubling Claude spend and pushing
# memory over the cap. 20 min comfortably outlives the longest legitimate
# extraction. Real dyno crashes mid-extraction take ~30s to detect on
# next boot anyway, so the 20-min wait isn't a correctness loss.
app.extraction.stuck-after-minutes=${EXTRACTION_STUCK_AFTER_MINUTES:20}

# ----------------- Auto-approval safety net -----------------
# PendingQuestionAutoApprover runs every hour at :15 UTC. Any PENDING
# question whose createdAt is older than this many hours gets auto-flipped
# to APPROVED with admin email "(auto-approve)" — so uploads don't sit
# in limbo forever if no domain admin reviews them. A Slack notice is
# fired summarising the per-cert breakdown. Set high (e.g. 999) to
# effectively disable the safety net while keeping the bean wired up.
app.auto-approve.after-hours=${AUTO_APPROVE_AFTER_HOURS:24}

logging.level.org.hibernate.SQL=warn
logging.level.org.springframework.security=info
