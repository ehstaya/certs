<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Salesforce Admin Quiz</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="auth-body">
<header class="topbar"><div class="brand">Certification Practice Playground</div></header>
<main class="auth-wrap">
  <section class="auth-card">
    <h1>Sign in</h1>
    <p class="muted">Welcome back. Sign in to continue your practice.</p>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    <div th:if="${info}" class="alert alert-info" th:text="${info}"></div>

    <form method="post" action="/login" class="auth-form" autocomplete="on">
      <label>Email
        <input type="email" name="email" required autofocus autocomplete="username" />
      </label>
      <label>Password
        <input type="password" name="password" required autocomplete="current-password" />
      </label>
      <button class="btn btn-primary btn-full" type="submit">Sign in</button>
    </form>

    <div class="auth-links">
      <a href="/forgot-password">Forgot password?</a>
      <span class="dot">·</span>
      <a href="/register">Create an account</a>
    </div>
  </section>
</main>
</body>
</html>
