<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Change password — Salesforce Admin Quiz</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="auth-body">
<header class="topbar"><div class="brand">Certification Practice Playground</div></header>
<main class="auth-wrap">
  <section class="auth-card">
    <h1>Change password</h1>
    <p class="muted" th:if="${forced}">You signed in with a temporary password. Please choose a new password to continue.</p>
    <p class="muted" th:unless="${forced}">Update your password.</p>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <form method="post" action="/change-password" class="auth-form" autocomplete="off">
      <label>
        <span th:text="${forced} ? 'Temporary password' : 'Current password'">Current password</span>
        <input type="password" name="currentPassword" required autofocus autocomplete="current-password" />
      </label>
      <label>New password
        <input type="password" name="newPassword" required minlength="8" autocomplete="new-password" />
      </label>
      <label>Confirm new password
        <input type="password" name="confirmPassword" required minlength="8" autocomplete="new-password" />
      </label>
      <button class="btn btn-primary btn-full" type="submit">Update password</button>
    </form>

    <div class="auth-links" th:unless="${forced}">
      <a href="/">Back to test</a>
    </div>
    <div class="auth-links" th:if="${forced}">
      <form method="post" action="/logout" style="display:inline">
        <button class="btn-link" type="submit">Sign out</button>
      </form>
    </div>
  </section>
</main>
</body>
</html>
