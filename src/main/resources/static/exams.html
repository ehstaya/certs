<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose a practice exam</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    /* Two-CTA card variant — adds a flex action row + a small mode hint */
    .exam-card--dual { display: flex; flex-direction: column; cursor: default; }
    .exam-card--dual:hover { transform: none; box-shadow: 0 1px 2px rgba(15,23,42,.04), 0 4px 12px rgba(15,23,42,.06); }
    .exam-card-actions {
      display: flex; gap: 8px; flex-wrap: wrap;
      padding: 12px 16px 4px; border-top: 1px solid var(--gray-200, #e5e7eb);
    }
    /* Both CTAs share identical sizing + shape — only the color tells
       Practice (blue) from Real exam (amber). Compact: smaller padding +
       12px text, matching the rest of the small-button language. */
    .exam-card-actions .btn {
      flex: 1;
      text-align: center;
      text-decoration: none;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid transparent;
      line-height: 1.4;
    }
    /* Practice — solid brand blue, identical to btn-primary elsewhere. */
    .exam-card-actions .btn-primary {
      background: var(--brand-primary, #0176D3);
      color: #fff;
      border-color: var(--brand-primary, #0176D3);
    }
    .exam-card-actions .btn-primary:hover {
      background: var(--brand-navy, #032D60);
      border-color: var(--brand-navy, #032D60);
    }
    /* Real exam — solid amber, same shape/size as Practice. The distinct
       hue signals "this is the serious option" without breaking the
       look + feel established by Practice. */
    .btn-exam {
      background: #f59e0b;
      color: #fff;
      border-color: #f59e0b;
    }
    .btn-exam:hover { background: #b45309; border-color: #b45309; }
    .exam-card-modehint {
      padding: 8px 16px 14px;
      font-size: 12px;
      color: var(--gray-600, #4b5563);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">Certification Practice Playground</div>
    <div class="topbar-actions" id="topbarActions">
      <a class="topbar-link user-link" href="/">Exams</a>
      <a class="topbar-link user-link" href="/my/reports">My reports</a>
      <a class="topbar-link user-link" href="/uploads">Add questions</a>
      <a class="topbar-link admin-only" href="/admin/questions" style="display:none">Questions</a>
    <a class="topbar-link admin-only" href="/admin/reports" style="display:none">Reports</a>
    <a class="topbar-link superadmin-only" href="/admin" style="display:none">Admin Dashboard</a>
      <a class="topbar-link" href="/change-password">Change password</a>
      <span class="topbar-user" id="userBadge"></span>
      <form method="post" action="/logout" style="display:inline">
        <button type="submit" class="topbar-link as-btn">Sign out</button>
      </form>
    </div>
  </header>

  <main class="picker">
    <div class="picker-head">
      <h1 class="picker-title">Choose a practice exam</h1>
      <p class="picker-subtitle">Pick a certification track to start a timed practice session. Your progress and timer are tracked per exam.</p>
    </div>
    <div id="examGrid" class="exam-grid">
      <div class="picker-empty" id="examLoading">Loading exams…</div>
    </div>
  </main>

  <script>
    (function () {
      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
          return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
        });
      }

      async function loadUser() {
        try {
          const res = await fetch("/api/me", { credentials: "same-origin" });
          if (!res.ok) return;
          const data = await res.json();
          if (!data.authenticated) { window.location.href = "/login"; return; }
          const name = data.fullName && data.fullName.trim() ? data.fullName : data.email;
          const role = data.role || "USER";
          const badge = document.getElementById("userBadge");
          if (badge) badge.textContent = name + " (" + role + ")";
          if (role === "ADMIN") {
            document.querySelectorAll(".admin-only").forEach(el => { el.style.display = ""; });
          }
          if (role === "SUPERADMIN") {
            document.querySelectorAll(".superadmin-only").forEach(el => { el.style.display = ""; });
            document.querySelectorAll(".user-link").forEach(el => { el.style.display = "none"; });
          }
        } catch (e) { /* header just stays blank */ }
      }

      async function loadExams() {
        const grid = document.getElementById("examGrid");
        try {
          const res = await fetch("/api/exams", { credentials: "same-origin" });
          if (res.status === 401 || res.status === 403) { window.location.href = "/login"; return; }
          if (!res.ok) throw new Error("Failed to load exams");
          const exams = await res.json();
          if (!Array.isArray(exams) || exams.length === 0) {
            grid.innerHTML = '<div class="picker-empty">No exams available yet. An admin can add one via the import API.</div>';
            return;
          }
          grid.innerHTML = "";
          exams.forEach(function (ex) {
            // Card is now a div (not <a>) so we can host two distinct CTAs:
            //   Practice — feedback after every answer, navigate freely.
            //   Exam     — strict sequential, no feedback until Finish.
            // The mode rides through topic-info into the quiz URL.
            const card = document.createElement("div");
            card.className = "exam-card exam-card--dual";
            const slug = encodeURIComponent(ex.slug);
            card.innerHTML =
              '<div class="exam-card-body">' +
                '<h2 class="exam-card-name">' + esc(ex.name) + '</h2>' +
                '<p class="exam-card-desc">' + esc(ex.description || "") + '</p>' +
              '</div>' +
              '<div class="exam-card-meta">' +
                '<span class="exam-chip">' + ex.questionsPerSession + ' questions / session</span>' +
                '<span class="exam-chip">' + ex.durationMinutes + ' min</span>' +
                '<span class="exam-chip">' + ex.questionCount + ' in bank</span>' +
              '</div>' +
              '<div class="exam-card-actions">' +
                '<a class="btn btn-primary" href="/topic-info.html?exam=' + slug + '&mode=practice">Practice ›</a>' +
                // Real exam launches the quiz directly — no topic-info
                // breakdown, just like sitting down at a proctored exam.
                '<a class="btn btn-exam" href="/index.html?exam=' + slug + '&mode=exam"' +
                   ' title="Real-exam simulation: no feedback during the test, no skipping, no going back. Score + review only at the end.">Real exam ›</a>' +
              '</div>' +
              '<div class="exam-card-modehint">' +
                '<strong>Practice</strong>: see correct / wrong + explanation after every answer.<br/>' +
                '<strong>Exam</strong>: simulate the real test — answer each in order, no feedback until Finish.' +
              '</div>';
            grid.appendChild(card);
          });
        } catch (e) {
          grid.innerHTML = '<div class="picker-empty">Could not load exams: ' + esc(e.message) + '</div>';
        }
      }

      loadUser();
      loadExams();
    })();
  </script>
</body>
</html>
