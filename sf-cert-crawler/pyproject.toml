[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sf-cert-crawler"
version = "0.1.0"
description = "Crawls public, free Salesforce certification study material for personal exam prep."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ehstaya", email = "ehstaya@gmail.com" }]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "sqlalchemy>=2.0",
    "anthropic>=0.40",
    "typer>=0.12",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
# Semantic (near-duplicate) dedup — pulls torch transitively; only needed for
# `--semantic-dedup`. Without it the crawler still does exact-hash dedup.
dedup = [
    "sentence-transformers>=2.2",
]
# Internal agent — Google Drive source + PDF reading.
internal = [
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "pypdf>=4.0",
]

[project.scripts]
sf-crawler = "crawler.__main__:app"
sf-crawler-external = "crawler.external.__main__:app"
sf-crawler-internal = "crawler.internal.__main__:app"

[tool.setuptools.packages.find]
include = ["crawler*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
